  .act-n span{color:var(--accent);font-weight:700}

  }

    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;stroke:var(--ink-3);pointer-events:none;
  }

    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:24px;height:24px;border:none;border-radius:50%;
    background:var(--line);color:var(--ink-2);font-size:14px;line-height:1;
    cursor:pointer;display:none;

  .nav-cat-name{
    font-size:14px;font-weight:700;color:var(--ink-2);

  .nav-items li.active{color:var(--accent);font-weight:500;background:var(--accent-soft)}

    word-break:break-all;
  }

  .src-note{color:var(--muted);font-size:13px}
  .back-link{
    display:inline-block;margin-top:44px;font-size:15px;color:var(--ink-2);cursor:pointer;
  }
  .back-link:hover{color:var(--accent)}

  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  @media(max-width:900px){
    .page{flex-direction:column;gap:0;padding:0 20px}
    aside{width:100%;height:auto;position:static;padding:26px 0 6px;overflow:visible}
    .site-title{margin-bottom:16px;font-size:23px}
    .search-box{margin-bottom:18px}
    .nav-label{display:none}
    .nav-tree{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .nav-all{width:auto;margin:0;padding:5px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px}
    .nav-cat{margin:0}
    .nav-cat-name{width:auto;padding:5px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px}
    .nav-cat-name .arrow{display:none}
    .nav-cat .nav-items{display:none!important}
    main{padding:22px 0 80px;max-width:none}
    h1.page-title{font-size:27px}
  }
</style>
</head>

  "category": "实用技巧",
  "core": "老郑总结的 Agent 时代 10 条心法：人负责说清要什么、判断对不对，AI 负责动手跑和验证；拉开差距的是把复杂事拆成 AI 能自己跑、自己验收的一整套活。",

  "detail": [

    "h": "分工变了",
    "items": [
     "人负责说清楚要什么、判断对不对，AI 负责动手跑和验证",
     "拉开差距的不是谁工具多，而是谁能把复杂事拆成 AI 能自己跑、自己验收的一整套活，再把最后那点人味留给自己"
    ]
   },
   {
    "h": "目标与任务",
    "items": [
     "先说清目标，别规定每一步怎么做，把业务边界、性能、成本、交付标准定义清楚",
     "别一轮轮磨，让 AI 自己建一套能试错、能评估、能筛选的系统",
     "任务一次给足，配合定时任务，AI 跑完拿证据来找你；别等 AI，让 AI 等你"
    ]

    "h": "模型与验收",
    "items": [

     "用证据验收：接口能不能调、视频能不能出、异常能不能恢复，这些才是真证据",

     "手法用按压或轻拍，先在掌心温热再覆盖到部位，不要搓揉干燥脆弱的皮肤",

    "h": "禁忌与挑选",
    "items": [

    ]

    "items": [
     "ASD-STE100 简化技术英语是一套受控语言标准，目标是让技术文档简单、清楚、没有歧义",
     "1980 年代由欧洲航空航天工业协会（AECMA）应欧洲航空业要求开发：维修手册要让非英语母语的技师也能准确看懂",

     "名词短语不超过 3 个词；不要为了缩短而省略主语、动词、冠词等句子成分",

const navTree = document.getElementById("navTree");
const searchInput = document.getElementById("search");
const clearBtn = document.getElementById("clearBtn");

let keyword = "";
let activeCat = "全部";
let closedCats = new Set();

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function hl(text){
  const t = esc(text);
  if(!keyword) return t;
  const k = esc(keyword).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return t.replace(new RegExp("(" + k + ")", "gi"), "<mark>$1</mark>");
}
function fmtDate(d){
  return String(d).replace(/-/g, "/");
}
function categories(){
  return [...new Set(ENTRIES.map(e => e.category))];
}
function entryMatches(e){
  if(!keyword) return true;
  const hay = [e.title, e.core, e.category, e.subtopic, ...e.points, ...e.tags].join(" ").toLowerCase();
  return hay.includes(keyword.toLowerCase());
}
function currentRoute(){
  const h = location.hash.replace(/^#\/?/, "");
  if(h.startsWith("e/")) return { type:"entry", id:h.slice(2) };
  if(h.startsWith("d/")) return { type:"digest", cat:decodeURIComponent(h.slice(2)) };
  if(h === "a") return { type:"actions" };
  return { type:"list" };
}

function renderNav(){
  const cats = categories();
  let html = '<button class="nav-all" data-actions="1" style="font-weight:700;color:var(--accent)">我的行动页</button>' +
    '<button class="nav-all' + (activeCat === "全部" ? " active" : "") + '" data-all="1">全部条目</button>';
  cats.forEach(c => {
    html += '<div class="nav-cat">' +
      '<button class="nav-cat-name' + (activeCat === c ? " active" : "") + '" data-cat="' + esc(c) + '">' + esc(c) + "</button></div>";
  });
  navTree.innerHTML = html;
  navTree.querySelector("[data-actions]").addEventListener("click", () => { location.hash = "#/a"; render(); });
  navTree.querySelector("[data-all]").addEventListener("click", () => {
    activeCat = "全部"; keyword = ""; searchInput.value = ""; clearBtn.classList.remove("show");
    location.hash = "#/"; render();
  });
  navTree.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => {
    activeCat = b.getAttribute("data-cat");
    location.hash = "#/"; render();
  }));
}

function digestMatches(d){
  if(!keyword) return false;
  const hay = [d.title, d.lead, ...d.sections.flatMap(s => [s.h, ...s.items])].join(" ").toLowerCase();
  return hay.includes(keyword.toLowerCase());
}
function renderList(){
  let list = ENTRIES.filter(e => (activeCat === "全部" || e.category === activeCat) && entryMatches(e));
  let html = '<div class="fade">';
  if(keyword){
    html += '<div class="search-note">搜索「' + esc(keyword) + "」</div>";
    Object.keys(DIGESTS).forEach(cat => {
      const d = DIGESTS[cat];
      if(!digestMatches(d)) return;
      html += '<div class="synth"><div class="digest-badge">先看整理 · ' + esc(cat) + '干货</div>' +
        "<h2>" + hl(d.title) + "</h2><p>" + hl(d.lead) + "</p>" +
        d.sections.map(sec => "<h3>" + esc(sec.h) + '</h3><ul>' + sec.items.map(i => "<li>" + hl(i) + "</li>").join("") + "</ul>").join("") +
        '<span class="go" data-digest="' + esc(cat) + '">打开干货页 →</span></div>';
    });
  } else if(activeCat !== "全部" && DIGESTS[activeCat]){
    const d = DIGESTS[activeCat];
    html += '<div class="digest-card" data-digest="' + esc(activeCat) + '">' +
      "<h2>" + esc(d.title) + "</h2><p>" + esc(d.lead) + '</p></div>';
  }
  if(list.length === 0){
    html += '<div class="empty">没有找到相关内容</div>';
  } else {
    html += '<div class="entry-list">' + list.map(e =>
      '<article class="entry-row" data-open="' + esc(e.id) + '">' +
        '<div class="date">' + fmtDate(e.date) + "</div>" +
        "<h2>" + hl(e.title) + "</h2>" +
        '<p class="core">' + hl(e.core) + "</p>" +
        '<div class="tags">' + e.tags.map(t => '<span class="tag">' + hl(t) + "</span>").join("") + "</div>" +
      "</article>"
    ).join("") + "</div>";
  }
  html += "</div>";
  main.innerHTML = html;
  main.querySelectorAll("[data-open]").forEach(r => r.addEventListener("click", () => {
    location.hash = "#/e/" + r.getAttribute("data-open");
  }));
  main.querySelectorAll("[data-digest]").forEach(r => r.addEventListener("click", () => {
    location.hash = "#/d/" + encodeURIComponent(r.getAttribute("data-digest"));
  }));
  renderNav(null);
}

function renderEntry(id){
  const e = ENTRIES.find(x => x.id === id);
  if(!e){ renderList(); return; }
  main.innerHTML =
    '<div class="fade"><div class="crumb"><a href="#/" data-cat-link="' + esc(e.category) + '">' + esc(e.category) + '</a><span class="sep">›</span>' + esc(e.subtopic) + "</div>" +
    '<h1 class="page-title">' + hl(e.title) + "</h1>" +
    '<div class="article-meta"><span>' + fmtDate(e.date) + "</span>" +
    e.tags.map(t => '<span class="tag">' + hl(t) + "</span>").join("") + "</div>" +
    '<p class="lead">' + hl(e.core) + "</p>" +
    '<ul class="points">' + e.points.slice(0, 3).map(p => "<li>" + hl(p) + "</li>").join("") + "</ul>" +
    (e.detail ? e.detail.map(sec =>
      '<div class="detail-sec"><h3>' + esc(sec.h) + '</h3><ul class="sec-list">' +
      sec.items.map(i => "<li>" + hl(i) + "</li>").join("") + "</ul></div>"
    ).join("") : "") +
    '<div class="sources"><div class="src-label">来源</div>' +
    e.sources.map(s => '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">↗ ' + esc(s.label) + "</a>").join("") + "</div>" +
    '<a class="back-link" id="backLink">← 返回列表</a></div>';
  document.getElementById("backLink").addEventListener("click", () => { location.hash = "#/"; });
  const cl = main.querySelector("[data-cat-link]");
  if(cl) cl.addEventListener("click", ev => { ev.preventDefault(); activeCat = cl.getAttribute("data-cat-link"); location.hash = "#/"; render(); });
  renderNav(id);
  window.scrollTo(0, 0);
}

function layerDiagram(d){
  if(!d.layers || !d.layers.length) return "";
  const W = 720, H = 50, GAP = 10;
  const widths = [300, 400, 500, 600];
  const fills = ["#284b63", "#5f8296", "#a9c1cc", "#eef3f0"];
  let y = 4, parts = "";
  d.layers.forEach((l, i) => {
    const w = widths[Math.min(i, widths.length - 1)];
    const x = (W - w) / 2;
    const dark = i < 2;
    const tc = dark ? "#ffffff" : "#2b2b2b";
    const sc = dark ? "rgba(255,255,255,0.88)" : "#4e4e4e";
    parts += '<g data-layer-g="' + esc(l.sec || "") + '" style="cursor:pointer;transition:opacity .25s ease">' +
      '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + H + '" rx="8" fill="' + fills[Math.min(i, fills.length - 1)] + '" stroke="var(--accent-2)" stroke-width="1"/>' +
      '<text x="360" y="' + (y + 22) + '" text-anchor="middle" font-size="16" font-weight="700" fill="' + tc + '">' + esc(l.name) + "</text>" +
      '<text x="360" y="' + (y + 41) + '" text-anchor="middle" font-size="13" fill="' + sc + '">' + esc(l.note) + "</text></g>";
    y += H + GAP;
  });
  return '<svg viewBox="0 0 ' + W + " " + (y - GAP + 4) + '" style="width:100%;height:auto;display:block;margin:6px 0 26px" role="img">' + parts + "</svg>";
}

function renderDigest(cat){
  activeLayerSec = null;
  const d = DIGESTS[cat];
  if(!d){ renderList(); return; }
  activeCat = cat;
  main.innerHTML =
    '<div class="fade"><div class="crumb"><a href="#/" data-cat-link="' + esc(cat) + '">' + esc(cat) + '</a><span class="sep">›</span>干货</div>' +
    '<h1 class="page-title">' + esc(d.title) + "</h1>" +
    '<p class="lead">' + esc(d.lead) + "</p>" +
    layerDiagram(d) +
    d.sections.map(sec =>
      '<div class="detail-sec" data-sec="' + esc(sec.h) + '"><h3>' + esc(sec.h) + '</h3><table class="kt">' +
      sec.items.map((it, ix) => '<tr><td class="kn">' + (ix + 1) + '</td><td>' + esc(it) + "</td></tr>").join("") + "</table></div>"
    ).join("") +
    '<div class="based-on"><div class="src-label">依据条目</div>' +
    d.basedOn.map(id => { const e = ENTRIES.find(x => x.id === id); return e ? '<a href="#/e/' + esc(id) + '">' + esc(e.title) + "</a>" : ""; }).join("") + "</div>" +
    '<a class="back-link" id="backLink">← 返回列表</a></div>';
  document.getElementById("backLink").addEventListener("click", () => { location.hash = "#/"; });
  const cl = main.querySelector("[data-cat-link]");
  if(cl) cl.addEventListener("click", ev => { ev.preventDefault(); activeCat = cat; location.hash = "#/"; render(); });
  renderNav(null);
  window.scrollTo(0, 0);
}

function renderActions(){
  activeLayerSec = null;
  let html = '<div class="fade"><h1 class="page-title">我的行动页</h1>' +
    '<p class="lead">只留对你加分的事。先看图：上面是结果，下面是底座；点任意一层，下面只留那一层的事。</p>' +
    layerDiagram({ layers: ACTION_LAYERS });
  ACTION_GROUPS.forEach(g => {
    const acts = ACTIONS.filter(a => g.from.includes(a.group));
    html += '<div class="detail-sec" data-sec="' + esc(g.name) + '"><h3>' + esc(g.name) + "</h3>" +
      acts.map(a =>
        '<div class="ai-item"><div class="ai-top"><div class="ai-t">' + esc(a.title) + '</div>' +
        '<span class="ai-pill">你只需：' + esc(a.next) + "</span></div>" +
        '<p class="ai-why">' + esc(a.why) + "</p>" +
        '<p class="ai-meta">成本：' + esc(a.cost) +
        (a.basis.length ? ' · 依据：' + a.basis.map(b => '<a href="#/e/' + esc(b.id) + '">' + esc(b.t) + "</a>").join("、") : "") +
        "</p></div>"
      ).join("") +
      ((AUTOCLOSE[g.name] || []).length ?
        '<div class="close-h">我能自主闭环</div>' +
        AUTOCLOSE[g.name].map(c =>
          '<div class="ai-item"><div class="ai-top"><div class="ai-t">' + esc(c.t) + '</div>' +
          '<span class="ai-pill">启动只要：' + esc(c.need) + "</span></div>" +
          '<p class="ai-why">' + esc(c.how) + "</p></div>"
        ).join("") : "") +
      "</div>";
  });
  html += "</div>";
  main.innerHTML = html;
  renderNav(null);
  window.scrollTo(0, 0);
}

function render(){
  const r = currentRoute();
  if(r.type === "entry") renderEntry(r.id);
  else if(r.type === "digest") renderDigest(r.cat);
  else if(r.type === "actions") renderActions();
  else renderList();
}

/* 详情页手势：快速左划返回列表；识别为手势后立即禁止选字，慢速选字不受影响 */
let gestureX = null, gestureY = null, gestureT = 0, gestureFired = false, gestureArmed = false;
function gestureStart(x, y){ gestureX = x; gestureY = y; gestureT = Date.now(); gestureFired = false; gestureArmed = false; }
function gestureEnd(){ gestureX = null; gestureArmed = false; document.body.classList.remove("no-select"); }
function gestureMove(x, y, ev){
  if(gestureX === null || gestureFired) return;
  if(currentRoute().type !== "entry") return;
  if(!gestureArmed){
    const sel = window.getSelection ? window.getSelection().toString() : "";
    if(sel){ gestureX = null; return; }
  }
  const dx = gestureX - x, dt = Date.now() - gestureT;
  if(!gestureArmed && dx > 24 && dt < 150 && Math.abs(y - gestureY) < 40){
    gestureArmed = true;
    document.body.classList.add("no-select");
    if(window.getSelection) window.getSelection().removeAllRanges();
  }
  if(gestureArmed){
    if(ev) ev.preventDefault();
    if(dx > 48){ gestureFired = true; gestureEnd(); location.hash = "#/"; }
  }
}
main.addEventListener("mousedown", e => { if(e.button === 0) gestureStart(e.clientX, e.clientY); });
document.addEventListener("mousemove", e => { if(e.buttons & 1) gestureMove(e.clientX, e.clientY, e); }, { passive: false });
document.addEventListener("mouseup", gestureEnd);
main.addEventListener("touchstart", e => { const t = e.touches[0]; gestureStart(t.clientX, t.clientY); }, { passive: true });
main.addEventListener("touchmove", e => { const t = e.touches[0]; gestureMove(t.clientX, t.clientY, null); }, { passive: true });
main.addEventListener("touchend", gestureEnd);
let activeLayerSec = null;
function applyLayerFilter(){
  main.querySelectorAll(".detail-sec[data-sec]").forEach(s => {
    s.style.display = (!activeLayerSec || s.getAttribute("data-sec") === activeLayerSec) ? "" : "none";
  });
  main.querySelectorAll("[data-layer-g]").forEach(g => {
    g.style.opacity = (!activeLayerSec || g.getAttribute("data-layer-g") === activeLayerSec) ? "1" : "0.4";
  });
}
main.addEventListener("click", ev => {
  const rt = currentRoute().type;
  if(rt !== "digest" && rt !== "actions") return;
  const g = ev.target.closest ? ev.target.closest("[data-layer-g]") : null;
  if(g){
    const t = g.getAttribute("data-layer-g");
    activeLayerSec = (activeLayerSec === t) ? null : t;
    applyLayerFilter();
    return;
  }
  if(activeLayerSec && (ev.target === main || ev.target.classList.contains("fade"))){
    activeLayerSec = null;
    applyLayerFilter();
  }
});
window.addEventListener("hashchange", render);
document.getElementById("homeLink").addEventListener("click", () => {
  activeCat = "全部"; keyword = ""; searchInput.value = ""; clearBtn.classList.remove("show");
  location.hash = "#/"; render();
});
searchInput.addEventListener("input", () => {
  keyword = searchInput.value.trim();
  clearBtn.classList.toggle("show", keyword.length > 0);
  if(currentRoute().type !== "list"){ history.replaceState(null, "", "#/"); }
  renderList();
});
searchInput.addEventListener("keydown", e => { if(e.key === "Escape"){ searchInput.value = ""; keyword = ""; clearBtn.classList.remove("show"); renderList(); } });
clearBtn.addEventListener("click", () => {
  searchInput.value = ""; keyword = ""; clearBtn.classList.remove("show"); renderList(); searchInput.focus();
});
render();
</script>
