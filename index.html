    --bg:#faf8f8;
    --ink:#2b2b2b;
    --ink-2:#4e4e4e;
    --ink-3:#9a958e;
    --line:#e5e2de;
    --accent:#284b63;
    --accent-soft:#eef3f0;
    --accent-2:#84a59d;
    --mark:#ffe08a;
    --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;

  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    font-size:16.5px;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  ::selection{background:#d7e5df}
  mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
  a{color:var(--accent);text-decoration:none}

  .page{
    max-width:1180px;margin:0 auto;
    display:flex;gap:56px;
    padding:0 28px;
    align-items:flex-start;
  }

  /* 左侧栏 */
  aside{
    width:272px;flex:none;
    position:sticky;top:0;height:100vh;overflow-y:auto;
    padding:44px 0 40px;
    scrollbar-width:none;
  }
  aside::-webkit-scrollbar{display:none}
  .site-title{
    font-family:var(--serif);font-weight:900;
    font-size:25px;letter-spacing:.05em;color:var(--ink);
    display:block;margin-bottom:26px;cursor:pointer;
  }
  .site-title:hover{color:var(--accent)}
  .search-box{position:relative;margin-bottom:34px}
  .search-box svg{
    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;stroke:var(--ink-3);pointer-events:none;
  }
  #search{
    width:100%;font:inherit;font-size:14.5px;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:8px;
    padding:9px 34px 9px 36px;outline:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  #search:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
  #search::placeholder{color:var(--ink-3)}
  #clearBtn{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:24px;height:24px;border:none;border-radius:50%;
    background:var(--line);color:var(--ink-2);font-size:14px;line-height:1;
    cursor:pointer;display:none;
  }
  #clearBtn.show{display:block}
  .nav-label{
    font-size:12px;letter-spacing:.18em;color:var(--ink-3);
    margin-bottom:12px;font-weight:500;
  }
  .nav-all{
    display:block;width:100%;text-align:left;
    font:inherit;font-size:15px;font-weight:500;color:var(--ink-2);
    background:none;border:none;border-radius:6px;
    padding:5px 8px;cursor:pointer;margin-bottom:10px;
  }
  .nav-all:hover{color:var(--accent);background:var(--accent-soft)}
  .nav-all.active{color:var(--accent);background:var(--accent-soft)}
  .nav-cat{margin-bottom:4px}
  .nav-cat-name{
    font-size:14px;font-weight:700;color:var(--ink-2);
    padding:5px 8px;display:flex;align-items:center;gap:6px;
    cursor:pointer;border-radius:6px;border:none;background:none;
    width:100%;text-align:left;font-family:inherit;
  }
  .nav-cat-name:hover{color:var(--accent);background:var(--accent-soft)}
  .nav-cat-name.active{color:var(--accent);background:var(--accent-soft)}
  .nav-cat-name .arrow{font-size:10px;color:var(--ink-3);transition:transform .25s ease}
  .nav-cat.closed .arrow{transform:rotate(-90deg)}
  .nav-cat.closed .nav-items{display:none}
  .nav-items{list-style:none;margin:1px 0 8px 14px;border-left:1px solid var(--line);padding-left:12px}
  .nav-items li{
    font-size:14px;color:var(--ink-2);line-height:1.5;
    padding:4px 6px;border-radius:5px;cursor:pointer;
  }
  .nav-items li:hover{color:var(--accent);background:var(--accent-soft)}
  .nav-items li.active{color:var(--accent);font-weight:500;background:var(--accent-soft)}

  /* 中栏 */
  main{flex:1;min-width:0;max-width:740px;padding:52px 0 110px}
  .crumb{font-size:13.5px;color:var(--ink-3);margin-bottom:20px;letter-spacing:.02em}
  .crumb a{color:var(--ink-3)}
  .crumb a:hover{color:var(--accent)}

  h1.page-title{

  .tag{font-size:12.5px;color:#b7b2aa;line-height:1.6}
  .tag::before{content:"#";opacity:.4;margin-right:1px}
  .lead{
    font-size:17.5px;line-height:1.95;color:var(--ink);
    letter-spacing:.01em;margin-bottom:30px;
  }
  .points{list-style:none;margin-bottom:38px}
  .points li{
    position:relative;
    font-size:16.5px;line-height:1.9;color:var(--ink-2);letter-spacing:.01em;
    padding-left:22px;margin-bottom:13px;
  }
  .points li::before{
    content:"";position:absolute;left:2px;top:.72em;
    width:7px;height:7px;border-radius:50%;background:var(--accent-2);
  }
  .sources{border-top:1px solid var(--line);padding-top:20px}
  .sources .src-label{font-size:12px;letter-spacing:.18em;color:var(--ink-3);margin-bottom:11px;font-weight:500}
  .sources a{
    display:inline-flex;align-items:center;gap:6px;
    font-size:15px;font-weight:500;margin:0 22px 8px 0;
    border-bottom:1px solid transparent;transition:border-color .18s ease;
    word-break:break-all;
  }
  .sources a:hover{border-bottom-color:var(--accent)}
  .back-link{
    display:inline-block;margin-top:44px;font-size:15px;color:var(--ink-2);cursor:pointer;
  }
  .back-link:hover{color:var(--accent)}

  .fade{animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  @media(max-width:900px){
    .page{flex-direction:column;gap:0;padding:0 20px}
    aside{width:100%;height:auto;position:static;padding:26px 0 6px;overflow:visible}

    .search-box{margin-bottom:18px}

    .nav-tree{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

    .nav-cat{margin:0}
    .nav-cat-name{width:auto;padding:5px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px}
    .nav-cat-name .arrow{display:none}
    .nav-cat .nav-items{display:none!important}
    main{padding:22px 0 80px;max-width:none}
    h1.page-title{font-size:27px}

const main = document.getElementById("main");
const navTree = document.getElementById("navTree");
const searchInput = document.getElementById("search");
const clearBtn = document.getElementById("clearBtn");

let keyword = "";
let activeCat = "全部";
let closedCats = new Set();

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function hl(text){
  const t = esc(text);
  if(!keyword) return t;
  const k = esc(keyword).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return t.replace(new RegExp("(" + k + ")", "gi"), "<mark>$1</mark>");
}
function fmtDate(d){
  return String(d).replace(/-/g, "/");
}
function categories(){
  return [...new Set(ENTRIES.map(e => e.category))];
}
function entryMatches(e){
  if(!keyword) return true;
  const hay = [e.title, e.core, e.category, e.subtopic, ...e.points, ...e.tags].join(" ").toLowerCase();
  return hay.includes(keyword.toLowerCase());
}
function currentRoute(){
  const h = location.hash.replace(/^#\/?/, "");
  if(h.startsWith("e/")) return { type:"entry", id:h.slice(2) };
  return { type:"list" };
}

function renderNav(){
  const cats = categories();
  let html = '<button class="nav-all' + (activeCat === "全部" ? " active" : "") + '" data-all="1">全部条目</button>';
  cats.forEach(c => {
    html += '<div class="nav-cat">' +
      '<button class="nav-cat-name' + (activeCat === c ? " active" : "") + '" data-cat="' + esc(c) + '">' + esc(c) + "</button></div>";
  });
  navTree.innerHTML = html;
  navTree.querySelector("[data-all]").addEventListener("click", () => {
    activeCat = "全部"; keyword = ""; searchInput.value = ""; clearBtn.classList.remove("show");
    location.hash = "#/"; render();
  });
  navTree.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => {
    activeCat = b.getAttribute("data-cat");
    location.hash = "#/"; render();
  }));
}

function renderList(){
  let list = ENTRIES.filter(e => (activeCat === "全部" || e.category === activeCat) && entryMatches(e));
  let html = '<div class="fade">';
  if(keyword) html += '<div class="search-note">搜索「' + esc(keyword) + "」</div>";
  if(list.length === 0){
    html += '<div class="empty">没有找到相关内容</div>';
  } else {
    html += '<div class="entry-list">' + list.map(e =>
      '<article class="entry-row" data-open="' + esc(e.id) + '">' +
        '<div class="date">' + fmtDate(e.date) + "</div>" +
        "<h2>" + hl(e.title) + "</h2>" +
        '<p class="core">' + hl(e.core) + "</p>" +
        '<div class="tags">' + e.tags.map(t => '<span class="tag">' + hl(t) + "</span>").join("") + "</div>" +
      "</article>"
    ).join("") + "</div>";
  }
  html += "</div>";
  main.innerHTML = html;
  main.querySelectorAll("[data-open]").forEach(r => r.addEventListener("click", () => {
    location.hash = "#/e/" + r.getAttribute("data-open");
  }));
  renderNav(null);
}

function renderEntry(id){
  const e = ENTRIES.find(x => x.id === id);
  if(!e){ renderList(); return; }
  activeCat = e.category;
  main.innerHTML =
    '<div class="fade"><div class="crumb"><a href="#/" data-cat-link="' + esc(e.category) + '">' + esc(e.category) + '</a><span class="sep">›</span>' + esc(e.subtopic) + "</div>" +
    '<h1 class="page-title">' + hl(e.title) + "</h1>" +
    '<div class="article-meta"><span>' + fmtDate(e.date) + "</span>" +
    e.tags.map(t => '<span class="tag">' + hl(t) + "</span>").join("") + "</div>" +
    '<p class="lead">' + hl(e.core) + "</p>" +
    '<ul class="points">' + e.points.slice(0, 3).map(p => "<li>" + hl(p) + "</li>").join("") + "</ul>" +
    '<div class="sources"><div class="src-label">来源</div>' +
    e.sources.map(s => '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">↗ ' + esc(s.label) + "</a>").join("") + "</div>" +
    '<a class="back-link" id="backLink">← 返回列表</a></div>';
  document.getElementById("backLink").addEventListener("click", () => { location.hash = "#/"; });
  const cl = main.querySelector("[data-cat-link]");
  if(cl) cl.addEventListener("click", ev => { ev.preventDefault(); activeCat = cl.getAttribute("data-cat-link"); location.hash = "#/"; render(); });
  renderNav(id);
  window.scrollTo(0, 0);
}

function render(){
  const r = currentRoute();
  if(r.type === "entry") renderEntry(r.id); else renderList();
}
window.addEventListener("hashchange", render);
document.getElementById("homeLink").addEventListener("click", () => {
  activeCat = "全部"; keyword = ""; searchInput.value = ""; clearBtn.classList.remove("show");
  location.hash = "#/"; render();
});
searchInput.addEventListener("input", () => {
  keyword = searchInput.value.trim();
  clearBtn.classList.toggle("show", keyword.length > 0);
  if(currentRoute().type !== "list"){ history.replaceState(null, "", "#/"); }
  renderList();
});
searchInput.addEventListener("keydown", e => { if(e.key === "Escape"){ searchInput.value = ""; keyword = ""; clearBtn.classList.remove("show"); renderList(); } });
clearBtn.addEventListener("click", () => {
  searchInput.value = ""; keyword = ""; clearBtn.classList.remove("show"); renderList(); searchInput.focus();
});
render();
</script>
</body>
</html>
