<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人知识库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5f0;
    --surface:#ffffff;
    --ink:#1c1a17;
    --ink-2:#57534b;
    --ink-3:#8a857c;
    --line:#e6e1d8;
    --accent:#9a3b26;
    --accent-soft:#f3e3dc;
    --mark:#ffe08a;
    --radius:18px;
    --shadow:0 2px 10px rgba(28,26,23,.05),0 18px 40px -18px rgba(28,26,23,.14);
    --shadow-hover:0 4px 14px rgba(28,26,23,.07),0 26px 54px -18px rgba(28,26,23,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

  header{
    max-width:880px;width:100%;
    margin:0 auto;
    padding:56px 24px 8px;
    text-align:center;
  }
  header h1{
    font-family:"Noto Serif SC",serif;
    font-size:clamp(30px,5vw,42px);
    font-weight:700;
    letter-spacing:.06em;
  }

  .toolbar{
    position:sticky;top:0;z-index:40;
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    padding:20px 24px 14px;
  }
  .toolbar-inner{max-width:880px;margin:0 auto}
  .search-wrap{position:relative}
  .search-wrap svg{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    width:19px;height:19px;stroke:var(--ink-3);pointer-events:none;
  }
  #search{
    width:100%;
    font:inherit;font-size:16px;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    padding:13px 48px 13px 46px;
    outline:none;
    box-shadow:var(--shadow);
    transition:border-color .25s ease,box-shadow .25s ease;
  }
  #search:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow)}
  #search::placeholder{color:var(--ink-3)}
  #clearBtn{
    position:absolute;right:8px;top:50%;transform:translateY(-50%) scale(.8);
    width:32px;height:32px;border:none;border-radius:50%;
    background:var(--line);color:var(--ink-2);
    font-size:16px;line-height:1;cursor:pointer;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease,background .2s ease;
  }
  #clearBtn.show{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
  #clearBtn:hover{background:var(--accent-soft);color:var(--accent)}

  .chips{
    display:flex;flex-wrap:wrap;gap:8px;
    margin-top:14px;justify-content:center;
  }
  .chip{
    font:inherit;font-size:13.5px;font-weight:500;
    color:var(--ink-2);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 14px;
    cursor:pointer;
    transition:all .22s ease;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip .count{opacity:.55;font-size:12px;margin-left:5px}

  main{
    flex:1;
    max-width:880px;width:100%;
    margin:0 auto;
    padding:18px 24px 72px;
  }
  .grid{display:flex;flex-direction:column;gap:16px}
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 28px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .28s cubic-bezier(.22,1,.36,1),box-shadow .28s ease,opacity .3s ease;
    animation:rise .45s cubic-bezier(.22,1,.36,1) both;
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
  .card:active{transform:translateY(-1px) scale(.995)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .card .meta{
    font-size:12.5px;color:var(--ink-3);letter-spacing:.04em;
    margin-bottom:8px;
  }
  .card h2{
    font-family:"Noto Serif SC",serif;
    font-size:21px;font-weight:700;line-height:1.45;
    margin-bottom:7px;
  }
  .card .core{font-size:15.5px;color:var(--ink-2)}

  .empty{
    text-align:center;color:var(--ink-3);
    padding:80px 20px;font-size:16px;
    animation:rise .35s ease both;
  }

  footer{
    text-align:center;
    color:var(--ink-3);
    font-size:13px;letter-spacing:.14em;
    padding:28px 16px 36px;
  }

  .overlay{
    position:fixed;inset:0;z-index:60;
    background:rgba(24,21,18,.48);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;
    transition:opacity .3s ease;
  }
  .overlay.open{opacity:1;pointer-events:auto}
  .modal{
    background:var(--surface);
    width:100%;max-width:680px;
    max-height:88vh;overflow-y:auto;
    border-radius:24px 24px 0 0;
    padding:34px 32px 42px;
    transform:translateY(36px);
    transition:transform .38s cubic-bezier(.22,1,.36,1);
  }
  .overlay.open .modal{transform:translateY(0)}
  @media(min-width:720px){
    .overlay{align-items:center;padding:24px}
    .modal{border-radius:24px}
  }
  .modal .meta{font-size:12.5px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:10px}
  .modal h2{
    font-family:"Noto Serif SC",serif;
    font-size:25px;font-weight:700;line-height:1.45;
    padding-right:40px;
  }
  .modal .core{
    font-size:16.5px;color:var(--ink);
    margin:14px 0 22px;
    padding-left:14px;border-left:3px solid var(--accent);
  }
  .modal ol{list-style:none;counter-reset:pt;display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
  .modal ol li{
    counter-increment:pt;
    display:flex;gap:13px;align-items:flex-start;
    font-size:15.5px;color:var(--ink-2);
  }
  .modal ol li::before{
    content:counter(pt);
    flex:none;width:24px;height:24px;border-radius:50%;
    background:var(--accent-soft);color:var(--accent);
    font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    margin-top:2px;
  }
  .modal .sources{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:9px}
  .modal .sources a{
    color:var(--accent);text-decoration:none;font-size:14.5px;font-weight:500;
    display:inline-flex;align-items:center;gap:7px;
    transition:opacity .2s ease;
    word-break:break-all;
  }
  .modal .sources a:hover{opacity:.72;text-decoration:underline}
  .modal .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}
  .modal .tags span{
    font-size:12px;color:var(--ink-3);
    background:var(--bg);border:1px solid var(--line);
    border-radius:999px;padding:3px 11px;
  }
  #closeBtn{
    position:sticky;top:0;float:right;
    width:36px;height:36px;border:none;border-radius:50%;
    background:var(--bg);color:var(--ink-2);
    font-size:18px;line-height:1;cursor:pointer;
    transition:background .2s ease,color .2s ease;
  }
  #closeBtn:hover{background:var(--accent-soft);color:var(--accent)}
</style>
</head>
<body>

<header>
  <h1>个人知识库</h1>
</header>

<div class="toolbar">
  <div class="toolbar-inner">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
      <input id="search" type="text" placeholder="搜索…" autocomplete="off" aria-label="搜索">
      <button id="clearBtn" type="button" aria-label="清除搜索">×</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>无结果</div>
</main>

<footer>个人知识库</footer>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal"></div>
</div>

<script>
const ENTRIES = [
  {
    id: "somark-oxr",
    category: "开源项目",
    subtopic: "文档解析",
    date: "2026-10-28",
    tags: ["OCR", "文档解析", "开源"],
    title: "SoMark OXR：开源文档解析模型",
    core: "把 PDF、图片解析成 Markdown/JSON，开源可本地部署。",
    points: [
      "仓库含效果演示、部署文档和预训练模型链接",
      "本地跑：一张消费级显卡就能带得动",
      "代码在 GitHub，权重在 Hugging Face"
    ],
    sources: [
      { label: "GitHub 仓库", url: "https://github.com/SoMarkAI/OXR" },
      { label: "Hugging Face 权重", url: "https://huggingface.co/SoMarkAI/OXR-1.0" }
    ]
  },
  {
    id: "gpt61-terra",
    category: "AI与商业化",
    subtopic: "行业动态",
    date: "2026-10-28",
    tags: ["OpenAI", "Anthropic", "模型发布"],
    title: "GPT-6.1 Terra 发布，Anthropic 提交上市",
    core: "官方说更快更便宜，评测说综合能力不行。",
    points: [
      "价格低 50%，速度 3 倍多（官方）",
      "评测：只快，没别的（观点）",
      "Anthropic 同期提交 S-1，拟 Nasdaq 上市"
    ],
    sources: [
      { label: "SiliconANGLE 报道", url: "https://siliconangle.com/2026/10/26/openai-launches-gpt-6-1-terra-for-faster-better-performing-ai-agents-at-half-the-price/" },
      { label: "Nikkei Asia 报道", url: "https://asia.nikkei.com/business/markets/ipo/anthropic-s-ipo-filing-shows-explosive-growth-risks-and-staggering-costs" }
    ]
  },
  {
    id: "vibe-pay",
    category: "AI与商业化",
    subtopic: "支付",
    date: "2026-10-27",
    tags: ["支付宝", "AI应用", "收款"],
    title: "支付宝 Vibe Pay：个人也能给 AI 应用收款",
    core: "不用写支付代码，个人开发者也能正规收款。",
    points: [
      "自带 Skill，Agent 自动完成接入",
      "人只做三步：扫码授权、填私钥、提交审核",
      "门槛已低，关键看产品值不值得付费"
    ],
    sources: [
      { label: "视频号原视频", url: "https://weixin.qq.com/sph/Aaa8ve7NFC" }
    ]
  }
];

let activeCategory = "全部";
let keyword = "";

const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const chipsBox = document.getElementById("chips");
const searchInput = document.getElementById("search");
const clearBtn = document.getElementById("clearBtn");
const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");

function esc(s){
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function highlight(text){
  const t = esc(text);
  if(!keyword) return t;
  const k = esc(keyword).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return t.replace(new RegExp("(" + k + ")", "gi"), "<mark>$1</mark>");
}
function fmtDate(d){
  const m = d.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? (m[1] + "年" + Number(m[2]) + "月" + Number(m[3]) + "日") : d;
}
function matches(e){
  if(activeCategory !== "全部" && e.category !== activeCategory) return false;
  if(!keyword) return true;
  const hay = [e.title, e.core, e.category, e.subtopic, ...e.points, ...e.tags].join(" ").toLowerCase();
  return hay.includes(keyword.toLowerCase());
}
function renderChips(){
  const cats = ["全部", ...new Set(ENTRIES.map(e => e.category))];
  chipsBox.innerHTML = "";
  cats.forEach(c => {
    const n = c === "全部" ? ENTRIES.length : ENTRIES.filter(e => e.category === c).length;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (c === activeCategory ? " active" : "");
    b.innerHTML = esc(c) + '<span class="count">' + n + "</span>";
    b.addEventListener("click", () => { activeCategory = c; render(); });
    chipsBox.appendChild(b);
  });
}
function render(){
  renderChips();
  const list = ENTRIES.filter(matches);
  grid.innerHTML = "";
  list.forEach((e, i) => {
    const card = document.createElement("article");
    card.className = "card";
    card.style.animationDelay = (i * 60) + "ms";
    card.innerHTML =
      '<div class="meta">' + esc(e.category) + " · " + esc(e.subtopic) + " · " + fmtDate(e.date) + "</div>" +
      "<h2>" + highlight(e.title) + "</h2>" +
      '<p class="core">' + highlight(e.core) + "</p>";
    card.addEventListener("click", () => openModal(e));
    grid.appendChild(card);
  });
  empty.hidden = list.length > 0;
}
function openModal(e){
  modal.innerHTML =
    '<button id="closeBtn" type="button" aria-label="关闭">×</button>' +
    '<div class="meta">' + esc(e.category) + " · " + esc(e.subtopic) + " · " + fmtDate(e.date) + "</div>" +
    "<h2>" + highlight(e.title) + "</h2>" +
    '<p class="core">' + highlight(e.core) + "</p>" +
    "<ol>" + e.points.slice(0, 3).map(p => "<li><span>" + highlight(p) + "</span></li>").join("") + "</ol>" +
    '<div class="sources">' + e.sources.map(s =>
      '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">↗ ' + esc(s.label) + "</a>"
    ).join("") + "</div>" +
    '<div class="tags">' + e.tags.map(t => "<span>" + highlight(t) + "</span>").join("") + "</div>";
  document.getElementById("closeBtn").addEventListener("click", closeModal);
  overlay.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  overlay.classList.remove("open");
  document.body.style.overflow = "";
}
overlay.addEventListener("click", e => { if(e.target === overlay) closeModal(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });
searchInput.addEventListener("input", () => {
  keyword = searchInput.value.trim();
  clearBtn.classList.toggle("show", keyword.length > 0);
  render();
});
clearBtn.addEventListener("click", () => {
  searchInput.value = "";
  keyword = "";
  clearBtn.classList.remove("show");
  render();
  searchInput.focus();
});
render();
</script>
</body>
</html>
