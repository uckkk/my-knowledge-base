    --ink:#2b2b2b;

    line-height:1.75;
    -webkit-font-smoothing:antialiased;

  }

  body.no-select{user-select:none;-webkit-user-select:none}

  .act-t{font-weight:700;font-size:16.5px;margin-bottom:2px}
  .act-w{color:var(--ink-2);font-size:14.5px;margin-bottom:3px}
  .act-n{font-size:14.5px}
  .act-n span{color:var(--accent);font-weight:700}
  .act-m{font-size:13px;color:var(--ink-3);margin-top:3px}

  .ai-t{font-size:17px;font-weight:700;line-height:1.4}

  .cls-t{font-weight:700;font-size:15.5px;margin-bottom:2px}
  .cls-w{color:var(--ink-2);font-size:14.5px;margin-bottom:3px}

  a{color:var(--accent);text-decoration:none}

    display:flex;gap:56px;
    padding:0 28px;
    align-items:flex-start;

  .site-title{
    font-family:var(--serif);font-weight:900;
    font-size:25px;letter-spacing:.05em;color:var(--ink);
    display:block;margin-bottom:26px;cursor:pointer;
  }
  .site-title:hover{color:var(--accent)}
  .search-box{position:relative;margin-bottom:34px}
  .search-box svg{
    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;stroke:var(--ink-3);pointer-events:none;
  }
  #search{
    width:100%;font:inherit;font-size:14.5px;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:8px;
    padding:9px 34px 9px 36px;outline:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  #search:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
  #search::placeholder{color:var(--ink-3)}

    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:24px;height:24px;border:none;border-radius:50%;
    background:var(--line);color:var(--ink-2);font-size:14px;line-height:1;
    cursor:pointer;display:none;
  }
  #clearBtn.show{display:block}
  .nav-label{
    font-size:12px;letter-spacing:.18em;color:var(--ink-3);
    margin-bottom:12px;font-weight:500;

  .nav-all{
    display:block;width:100%;text-align:left;
    font:inherit;font-size:15px;font-weight:500;color:var(--ink-2);
    background:none;border:none;border-radius:6px;
    padding:5px 8px;cursor:pointer;margin-bottom:10px;
  }
  .nav-all:hover{color:var(--accent);background:var(--accent-soft)}
  .nav-all.active{color:var(--accent);background:var(--accent-soft)}
  .nav-cat{margin-bottom:4px}
  .nav-cat-name{
    font-size:14px;font-weight:700;color:var(--ink-2);
    padding:5px 8px;display:flex;align-items:center;gap:6px;
    cursor:pointer;border-radius:6px;border:none;background:none;
    width:100%;text-align:left;font-family:inherit;
  }
  .nav-cat-name:hover{color:var(--accent);background:var(--accent-soft)}
  .nav-cat-name.active{color:var(--accent);background:var(--accent-soft)}

  .nav-items li.active{color:var(--accent);font-weight:500;background:var(--accent-soft)}

    padding:18px 20px 16px;margin-bottom:26px;cursor:pointer;
  }

  .search-note{color:var(--ink-3);font-size:14px;margin-bottom:14px}

    color:var(--ink-3);font-size:14px;margin-bottom:26px;
  }
  .article-meta .dot{opacity:.5}
  .tag{font-size:12.5px;color:#b7b2aa;line-height:1.6}
  .tag::before{content:"#";opacity:.4;margin-right:1px}
  .lead{

    font-size:16.5px;line-height:1.9;color:var(--ink-2);letter-spacing:.01em;

  .sec-list{list-style:none}
  .sources{border-top:1px solid var(--line);padding-top:20px}
  .sources .src-label{font-size:12px;letter-spacing:.18em;color:var(--ink-3);margin-bottom:11px;font-weight:500}

    border-bottom:1px solid transparent;transition:border-color .18s ease;
    word-break:break-all;
  }
  .sources a:hover{border-bottom-color:var(--accent)}
  .src-note{color:var(--muted);font-size:13px}
  .back-link{
    display:inline-block;margin-top:44px;font-size:15px;color:var(--ink-2);cursor:pointer;
  }
  .back-link:hover{color:var(--accent)}

  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  @media(max-width:900px){
    .page{flex-direction:column;gap:0;padding:0 20px}
    aside{width:100%;height:auto;position:static;padding:26px 0 6px;overflow:visible}
    .site-title{margin-bottom:16px;font-size:23px}
    .search-box{margin-bottom:18px}
    .nav-label{display:none}
    .nav-tree{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .nav-all{width:auto;margin:0;padding:5px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px}
    .nav-cat{margin:0}
    .nav-cat-name{width:auto;padding:5px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px}
    .nav-cat-name .arrow{display:none}
    .nav-cat .nav-items{display:none!important}
    main{padding:22px 0 80px;max-width:none}
    h1.page-title{font-size:27px}
  }
</style>
</head>

    "detail": [
      {
        "h": "是什么：航空业的简化英语规范",
        "items": [
          "ASD-STE100 简化技术英语是一套受控语言标准，目标是让技术文档简单、清楚、没有歧义",
          "1980 年代由欧洲航空航天工业协会（AECMA）应欧洲航空业要求开发：维修手册要让非英语母语的技师也能准确看懂",
          "现行第 9 版于 2025 年 1 月发布，已成为国际标准；2013 年第 6 版起可免费获取",
          "整套标准只有两部分：53 条写作规则，加一本约 900 个批准词的词典"
        ]
      },
      {
        "h": "核心写作规则",
        "items": [
          "句子要短：操作说明每句不超过 20 个词，描述性文字不超过 25 个词；一句话只写一条指令，一段只讲一个主题且每段不超过 6 句",
          "用主动语态（写描述时施动者不明才用被动），只用动词的不定式、祈使式和简单时态，不造复杂动词结构",
          "名词短语不超过 3 个词；不要为了缩短而省略主语、动词、冠词等句子成分",
          "复杂内容改用竖排列表呈现；安全提示以明确的命令或条件开头"
        ]
      },
      {
        "h": "词典的用法逻辑",
        "items": [
          "只用词典里的批准词，且只能按规定的词性和意思用，一个词一个词性一个意思：例如 test 只作名词用，不能当动词",
          "同一个词只准用批准含义，例如 close 作动词只准表示关门、合闸，不能表示结束会议",
          "未批准的词词典会给出批准替代词，例如 accessible 要改用 access、形容词 close 要改用 near"
        ]
      },
      {
        "h": "为什么问答时借它有效",
        "items": [
          "只准用简单常用词加短句，从源头减少歧义表达和含糊空间",

let keyword = "";

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function hl(text){
  const t = esc(text);
  if(!keyword) return t;
  const k = esc(keyword).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return t.replace(new RegExp("(" + k + ")", "gi"), "<mark>$1</mark>");
}
function fmtDate(d){
  return String(d).replace(/-/g, "/");
}
function categories(){
  return [...new Set(ENTRIES.map(e => e.category))];
}
function entryMatches(e){
  if(!keyword) return true;
  const hay = [e.title, e.core, e.category, e.subtopic, ...e.points, ...e.tags].join(" ").toLowerCase();
  return hay.includes(keyword.toLowerCase());
}
function currentRoute(){
  const h = location.hash.replace(/^#\/?/, "");
  if(h.startsWith("e/")) return { type:"entry", id:h.slice(2) };
  if(h.startsWith("d/")) return { type:"digest", cat:decodeURIComponent(h.slice(2)) };
  if(h === "a") return { type:"actions" };
  return { type:"list" };
}

  cats.forEach(c => {

      '<button class="nav-cat-name' + (activeCat === c ? " active" : "") + '" data-cat="' + esc(c) + '">' + esc(c) + "</button></div>";
  });
  navTree.innerHTML = html;
  navTree.querySelector("[data-actions]").addEventListener("click", () => { location.hash = "#/a"; render(); });
  navTree.querySelector("[data-all]").addEventListener("click", () => {
    activeCat = "全部"; keyword = ""; searchInput.value = ""; clearBtn.classList.remove("show");
    location.hash = "#/"; render();

function layerDiagram(d){
  if(!d.layers || !d.layers.length) return "";
  const W = 720, H = 50, GAP = 10;
  const widths = [300, 400, 500, 600];
  const fills = ["#284b63", "#5f8296", "#a9c1cc", "#eef3f0"];
  let y = 4, parts = "";
  d.layers.forEach((l, i) => {
    const w = widths[Math.min(i, widths.length - 1)];
    const x = (W - w) / 2;
    const dark = i < 2;
    const tc = dark ? "#ffffff" : "#2b2b2b";
    const sc = dark ? "rgba(255,255,255,0.88)" : "#4e4e4e";
    parts += '<g data-layer-g="' + esc(l.sec || "") + '" style="cursor:pointer;transition:opacity .25s ease">' +
      '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + H + '" rx="8" fill="' + fills[Math.min(i, fills.length - 1)] + '" stroke="var(--accent-2)" stroke-width="1"/>' +
      '<text x="360" y="' + (y + 22) + '" text-anchor="middle" font-size="16" font-weight="700" fill="' + tc + '">' + esc(l.name) + "</text>" +
      '<text x="360" y="' + (y + 41) + '" text-anchor="middle" font-size="13" fill="' + sc + '">' + esc(l.note) + "</text></g>";
    y += H + GAP;
  });
  return '<svg viewBox="0 0 ' + W + " " + (y - GAP + 4) + '" style="width:100%;height:auto;display:block;margin:6px 0 26px" role="img">' + parts + "</svg>";
}

/* 详情页手势：快速左划返回列表；识别为手势后立即禁止选字，慢速选字不受影响 */
let gestureX = null, gestureY = null, gestureT = 0, gestureFired = false, gestureArmed = false;
function gestureStart(x, y){ gestureX = x; gestureY = y; gestureT = Date.now(); gestureFired = false; gestureArmed = false; }
function gestureEnd(){ gestureX = null; gestureArmed = false; document.body.classList.remove("no-select"); }
function gestureMove(x, y, ev){
  if(gestureX === null || gestureFired) return;
  if(currentRoute().type !== "entry") return;
  if(!gestureArmed){
    const sel = window.getSelection ? window.getSelection().toString() : "";
    if(sel){ gestureX = null; return; }
  }
  const dx = gestureX - x, dt = Date.now() - gestureT;
  if(!gestureArmed && dx > 24 && dt < 150 && Math.abs(y - gestureY) < 40){
    gestureArmed = true;
    document.body.classList.add("no-select");
    if(window.getSelection) window.getSelection().removeAllRanges();
  }
  if(gestureArmed){
    if(ev) ev.preventDefault();
    if(dx > 48){ gestureFired = true; gestureEnd(); location.hash = "#/"; }
  }
}
main.addEventListener("mousedown", e => { if(e.button === 0) gestureStart(e.clientX, e.clientY); });
document.addEventListener("mousemove", e => { if(e.buttons & 1) gestureMove(e.clientX, e.clientY, e); }, { passive: false });
document.addEventListener("mouseup", gestureEnd);
main.addEventListener("touchstart", e => { const t = e.touches[0]; gestureStart(t.clientX, t.clientY); }, { passive: true });
main.addEventListener("touchmove", e => { const t = e.touches[0]; gestureMove(t.clientX, t.clientY, null); }, { passive: true });
main.addEventListener("touchend", gestureEnd);
let activeLayerSec = null;
function applyLayerFilter(){
  main.querySelectorAll(".detail-sec[data-sec]").forEach(s => {
    s.style.display = (!activeLayerSec || s.getAttribute("data-sec") === activeLayerSec) ? "" : "none";
  });
  main.querySelectorAll("[data-layer-g]").forEach(g => {
    g.style.opacity = (!activeLayerSec || g.getAttribute("data-layer-g") === activeLayerSec) ? "1" : "0.4";
  });
}
main.addEventListener("click", ev => {
  const rt = currentRoute().type;
  if(rt !== "digest" && rt !== "actions") return;
  const g = ev.target.closest ? ev.target.closest("[data-layer-g]") : null;
  if(g){
    const t = g.getAttribute("data-layer-g");
    activeLayerSec = (activeLayerSec === t) ? null : t;
    applyLayerFilter();
    return;
  }
  if(activeLayerSec && (ev.target === main || ev.target.classList.contains("fade"))){
    activeLayerSec = null;
    applyLayerFilter();
  }
});

searchInput.addEventListener("input", () => {
  keyword = searchInput.value.trim();
  clearBtn.classList.toggle("show", keyword.length > 0);
  if(currentRoute().type !== "list"){ history.replaceState(null, "", "#/"); }
  renderList();
});
searchInput.addEventListener("keydown", e => { if(e.key === "Escape"){ searchInput.value = ""; keyword = ""; clearBtn.classList.remove("show"); renderList(); } });
clearBtn.addEventListener("click", () => {
  searchInput.value = ""; keyword = ""; clearBtn.classList.remove("show"); renderList(); searchInput.focus();
});
render();
</script>
</body>
</html>
