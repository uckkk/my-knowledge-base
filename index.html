function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function hl(text){
  const t = esc(text);
  if(!keyword) return t;
  const k = esc(keyword).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return t.replace(new RegExp("(" + k + ")", "gi"), "<mark>$1</mark>");
}
function fmtDate(d){
  return String(d).replace(/-/g, "/");
}
function categories(){
  return [...new Set(ENTRIES.map(e => e.category))];
}
function entryMatches(e){
  if(!keyword) return true;
  const hay = [e.title, e.core, e.category, e.subtopic, ...e.points, ...e.tags].join(" ").toLowerCase();
  return hay.includes(keyword.toLowerCase());
}
function currentRoute(){
  const h = location.hash.replace(/^#\/?/, "");
  if(h.startsWith("e/")) return { type:"entry", id:h.slice(2) };
  if(h.startsWith("d/")) return { type:"digest", cat:decodeURIComponent(h.slice(2)) };
  if(h === "a") return { type:"actions" };
  return { type:"list" };
}

function layerDiagram(d){
  if(!d.layers || !d.layers.length) return "";
  const W = 720, H = 50, GAP = 10;
  const widths = [300, 400, 500, 600];
  const fills = ["#284b63", "#5f8296", "#a9c1cc", "#eef3f0"];
  let y = 4, parts = "";
  d.layers.forEach((l, i) => {
    const w = widths[Math.min(i, widths.length - 1)];
    const x = (W - w) / 2;
    const dark = i < 2;
    const tc = dark ? "#ffffff" : "#2b2b2b";
    const sc = dark ? "rgba(255,255,255,0.88)" : "#4e4e4e";
    parts += '<g data-layer-g="' + esc(l.sec || "") + '" style="cursor:pointer;transition:opacity .25s ease">' +
      '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + H + '" rx="8" fill="' + fills[Math.min(i, fills.length - 1)] + '" stroke="var(--accent-2)" stroke-width="1"/>' +
      '<text x="360" y="' + (y + 22) + '" text-anchor="middle" font-size="16" font-weight="700" fill="' + tc + '">' + esc(l.name) + "</text>" +
      '<text x="360" y="' + (y + 41) + '" text-anchor="middle" font-size="13" fill="' + sc + '">' + esc(l.note) + "</text></g>";
    y += H + GAP;
  });
  return '<svg viewBox="0 0 ' + W + " " + (y - GAP + 4) + '" style="width:100%;height:auto;display:block;margin:6px 0 26px" role="img">' + parts + "</svg>";
}

/* 详情页手势：快速左划返回列表；识别为手势后立即禁止选字，慢速选字不受影响 */
let gestureX = null, gestureY = null, gestureT = 0, gestureFired = false, gestureArmed = false;
function gestureStart(x, y){ gestureX = x; gestureY = y; gestureT = Date.now(); gestureFired = false; gestureArmed = false; }
function gestureEnd(){ gestureX = null; gestureArmed = false; document.body.classList.remove("no-select"); }
function gestureMove(x, y, ev){
  if(gestureX === null || gestureFired) return;
  if(currentRoute().type !== "entry") return;
  if(!gestureArmed){
    const sel = window.getSelection ? window.getSelection().toString() : "";
    if(sel){ gestureX = null; return; }
  }
  const dx = gestureX - x, dt = Date.now() - gestureT;
  if(!gestureArmed && dx > 24 && dt < 150 && Math.abs(y - gestureY) < 40){
    gestureArmed = true;
    document.body.classList.add("no-select");
    if(window.getSelection) window.getSelection().removeAllRanges();
  }
  if(gestureArmed){
    if(ev) ev.preventDefault();
    if(dx > 48){ gestureFired = true; gestureEnd(); location.hash = "#/"; }
  }
}
main.addEventListener("mousedown", e => { if(e.button === 0) gestureStart(e.clientX, e.clientY); });
document.addEventListener("mousemove", e => { if(e.buttons & 1) gestureMove(e.clientX, e.clientY, e); }, { passive: false });
document.addEventListener("mouseup", gestureEnd);
main.addEventListener("touchstart", e => { const t = e.touches[0]; gestureStart(t.clientX, t.clientY); }, { passive: true });
main.addEventListener("touchmove", e => { const t = e.touches[0]; gestureMove(t.clientX, t.clientY, null); }, { passive: true });
main.addEventListener("touchend", gestureEnd);

  main.querySelectorAll(".detail-sec[data-sec]").forEach(s => {
    s.style.display = (!activeLayerSec || s.getAttribute("data-sec") === activeLayerSec) ? "" : "none";
  });
  main.querySelectorAll("[data-layer-g]").forEach(g => {
    g.style.opacity = (!activeLayerSec || g.getAttribute("data-layer-g") === activeLayerSec) ? "1" : "0.4";
  });
}
main.addEventListener("click", ev => {
  const rt = currentRoute().type;
  if(rt !== "digest" && rt !== "actions") return;
  const g = ev.target.closest ? ev.target.closest("[data-layer-g]") : null;
  if(g){
    const t = g.getAttribute("data-layer-g");
    activeLayerSec = (activeLayerSec === t) ? null : t;
    applyLayerFilter();
    return;
  }
  if(activeLayerSec && (ev.target === main || ev.target.classList.contains("fade"))){
    activeLayerSec = null;
    applyLayerFilter();
  }
});
window.addEventListener("hashchange", render);
document.getElementById("homeLink").addEventListener("click", () => {
  activeCat = "全部"; keyword = ""; searchInput.value = ""; clearBtn.classList.remove("show");
  location.hash = "#/"; render();
});
searchInput.addEventListener("input", () => {
  keyword = searchInput.value.trim();
  clearBtn.classList.toggle("show", keyword.length > 0);
  if(currentRoute().type !== "list"){ history.replaceState(null, "", "#/"); }
  renderList();
});
searchInput.addEventListener("keydown", e => { if(e.key === "Escape"){ searchInput.value = ""; keyword = ""; clearBtn.classList.remove("show"); renderList(); } });
clearBtn.addEventListener("click", () => {
  searchInput.value = ""; keyword = ""; clearBtn.classList.remove("show"); renderList(); searchInput.focus();
});
render();
</script>
</body>
</html>
