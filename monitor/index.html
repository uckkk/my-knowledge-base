<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>监控入口 · istone</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1b1d2e;color:#e8e8ea;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  a{color:#4aa3ff;text-decoration:none}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #33354a;flex-wrap:wrap}
  header h1{font-size:17px;font-weight:600}
  header .sub{font-size:13px;color:#9a9aad}
  header .sp{flex:1}
  .btn{background:#2a2a2a;border:1px solid #44465c;color:#e8e8ea;border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer}
  .btn:hover{border-color:#4aa3ff;color:#4aa3ff}
  .btn.primary{background:#4aa3ff;border-color:#4aa3ff;color:#fff}
  .btn.primary:hover{opacity:.9;color:#fff}
  .btn.danger{color:#ff5d6c}
  main{padding:24px 16px;max-width:640px;margin:0 auto}
  .card{background:#2a2a2a;border-radius:14px;padding:20px}
  .card h2{font-size:16px;margin-bottom:8px}
  .card p{font-size:14px;color:#b9b9c4;line-height:1.7}
  .card p+p{margin-top:8px}
  input[type=url]{width:100%;background:#1b1d2e;border:1px solid #44465c;border-radius:8px;color:#e8e8ea;padding:11px 12px;font-size:15px;margin:14px 0 12px;outline:none}
  input[type=url]:focus{border-color:#4aa3ff}
  .err{color:#ff5d6c;font-size:13px;min-height:18px;margin-top:8px}
  .note{font-size:13px;color:#9a9aad;line-height:1.7;margin-top:16px}
  .note b{color:#e8e8ea;font-weight:600}
  iframe{width:100%;height:calc(100vh - 57px);border:0;display:block;background:#1b1d2e}
  .center{text-align:center;padding:48px 16px}
  .center .big{font-size:18px;margin-bottom:10px}
  .center p{font-size:14px;color:#b9b9c4;line-height:1.7;max-width:520px;margin:0 auto 20px}
</style>
</head>
<body>
<header>
  <h1>监控入口</h1>
  <span class="sub" id="headSub"></span>
  <span class="sp"></span>
  <a class="btn" href="/">回知识库</a>
  <span id="headBtns"></span>
</header>
<div id="view"></div>
<script>
(function(){
  var KEY = "bwhmon_url";
  var view = document.getElementById("view");
  var headSub = document.getElementById("headSub");
  var headBtns = document.getElementById("headBtns");

  function norm(u){
    u = (u || "").trim();
    if(!/^https?:\/\//i.test(u)) return null;
    if(u.slice(-1) !== "/") u += "/";
    return u;
  }
  function hostOf(u){
    try{ return new URL(u).host; }catch(e){ return ""; }
  }
  function save(){
    var v = norm(document.getElementById("addr").value);
    var err = document.getElementById("err");
    if(!v){ err.textContent = "地址不对：以 http:// 或 https:// 开头，带上 token。"; return; }
    try{ localStorage.setItem(KEY, v); }catch(e){ err.textContent = "浏览器不让存，换个浏览器试试。"; return; }
    render();
  }
  function clearSaved(){ try{ localStorage.removeItem(KEY); }catch(e){} render(); }
  function edit(){ render(true); }

  function render(forceSetup){
    var url = null;
    try{ url = localStorage.getItem(KEY); }catch(e){}
    headBtns.innerHTML = "";
    if(url && !forceSetup){
      headSub.textContent = "已连接 " + hostOf(url);
      headBtns.innerHTML = '<button class="btn" id="bEdit">换地址</button> <button class="btn danger" id="bClear">清除保存</button>';
      document.getElementById("bEdit").onclick = edit;
      document.getElementById("bClear").onclick = clearSaved;
      if(/^https:\/\//i.test(url)){
        view.innerHTML = '<iframe src="' + url.replace(/"/g, "&quot;") + '" allow="clipboard-write"></iframe>';
      }else{
        view.innerHTML = '<div class="center"><div class="big">控制台是明文地址，嵌不进加密页面</div>' +
          '<p>浏览器不许 https 页面嵌 http 页面。点下面在新标签打开控制台，功能一样全。</p>' +
          '<p>想嵌进来看，把控制台做成 https 反代就行。</p>' +
          '<a class="btn primary" href="' + url.replace(/"/g, "&quot;") + '" target="_blank" rel="noopener">在新标签打开控制台</a></div>';
      }
      return;
    }
    headSub.textContent = "第一次用，先贴控制台地址";
    view.innerHTML = '<main><div class="card"><h2>贴一次，以后点开就是</h2>' +
      '<p>把控制台地址粘贴进来，格式是 http(s)://地址:端口/token/，记得带尾斜杠（没带会自动补）。</p>' +
      '<input type="url" id="addr" placeholder="https://你的地址:端口/token/" autocomplete="off" spellcheck="false">' +
      '<button class="btn primary" id="bSave">保存并打开</button><div class="err" id="err"></div>' +
      '<div class="note"><b>地址只存在这个浏览器里</b>，不会发到任何服务器，也不会写进网站源码。换浏览器或清掉网站数据后要重新贴一次。<br>' +
      '控制台地址带 token，等于口令，别发给别人。<br>' +
      '地址是 http 开头时只能点开新标签看；https 开头才能嵌进本页看。</div>' +
      '</div></main>';
    document.getElementById("bSave").onclick = save;
    document.getElementById("addr").addEventListener("keydown", function(e){ if(e.key === "Enter") save(); });
  }
  render();
})();
</script>
</body>
</html>
